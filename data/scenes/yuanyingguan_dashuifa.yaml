# 远瀛观与大水法景（西洋楼；专属场景构建器：western.build_yuanyingguan_dashuifa_scene）
#
# 依据（docs/sources/research-yuanyingguan-dashuifa.md）：
#   - 三者南北一线：北为远瀛观（高台上，坐北向南），中为大水法（石龛背靠远瀛观平台），
#     南为观水法（坐南朝北，帝王观喷泉处）（维基 / 样式雷图说 / OSM POI，medium）
#   - 远瀛观：倒凹字形十七间；中三间圆光门、券上圆形钟窗；主楼两层庑殿顶（二层鱼鳞金瓦）；
#     东西翼楼钟亭；门旁雕花石柱、石狮一对；台前东西弧形石梯（样式雷图说 / 维基 / 铜版画十四）
#   - 大水法：西洋石龛、狮子头喷水落七级水台；半圆海棠池，池心铜鹿、东西各五犬；
#     池外东西十三层方形喷水塔（维基 / 铜版画十五，medium）
#   - 观水法：平台宝座、铜鹤凉棚、半圆石屏心五件、东西方塔与巴洛克角门（维基 / 铜版画十六）
#
# 尺度（S-041，low）：高台 45 × 41 m 与三者间距取 OSM 遗址轮廓与 POI；其余按铜版画比例。
# 局部坐标：+X 东、+Y 北，原点 = OSM「大水法」POI。
scene:
  id: yuanyingguan_dashuifa
  name: 远瀛观与大水法
  special: yuanyingguan_dashuifa
