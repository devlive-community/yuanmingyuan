# 圆明三园 · OSM 真实水系版（v3）
#
# 与其他版本的区别：湖泊不再是示意矩形，而是 OpenStreetMap 实测水域多边形
# （© OSM 贡献者，ODbL；经 tools/osm_to_terrain.py 提取简化，S-028）。
# 各景按 OSM 兴趣点锚点摆放（位置为 POI 近似，非实测殿址）：
#   - 正大光明：大宫门内、扇面湖（water_210654673，西南）之北
#   - 九洲清晏：后湖（真实轮廓）南岸前
#   - 勤政亲贤：正大光明之东（相对摆位）
#   - 万方安和：其真实兴趣点（后湖西侧约 180 m）
#   - 方壶胜境：福海（真实轮廓，28.75 公顷）东北岸，三亭伸入湖中
#   - 含经堂：长春园中部（示意摆位，真实锚点未获）
#   - 正觉寺：绮春园正宫门西（示意摆位）
# 工作假设：景间距与殿址精度（S-028）；前湖未单独建模（留白即岸）。
